date: "2026-03-01"
title: "NEDO Entrepreneurs Program（NEP）への参加・受賞について"
title_ja: "NEDO Entrepreneurs Program（NEP）への参加・受賞について"
title_en: "Participation in and Award at the NEDO Entrepreneurs Program (NEP)"
description: "本研究室所属の学生である博士課程2年の盧 慧敏（ロ ケイビン）氏が、ディープテック・スタートアップの起業活動支援プログラムである2025年度 NEDO Entrepreneurs Program（NEP）開拓コースに参加しました。その成果発表の場である最終ピッチイベント「NEP-Lab（ねぷらぼ）2026」において、ベンチャーキャピタル関係者の選考によるVC賞を受賞しました。今回の起業活動は、盧氏が自身の修士論文および博士論文の研究テーマとして取り組んできた技術の社会実装を目指すものです。技術の独自性に加え、その応用可能性や社会的意義が高く評価され、今回の受賞につながりました。"
description_ja: "本研究室所属の学生である博士課程2年の盧 慧敏（ロ ケイビン）氏が、ディープテック・スタートアップの起業活動支援プログラムである2025年度 NEDO Entrepreneurs Program（NEP）開拓コースに参加しました。その成果発表の場である最終ピッチイベント「NEP-Lab（ねぷらぼ）2026」において、ベンチャーキャピタル関係者の選考によるVC賞を受賞しました。今回の起業活動は、盧氏が自身の修士論文および博士論文の研究テーマとして取り組んできた技術の社会実装を目指すものです。技術の独自性に加え、その応用可能性や社会的意義が高く評価され、今回の受賞につながりました。"
description_en: "Huimin Lu, a second-year doctoral student in our lab, participated in the 2025 NEDO Entrepreneurs Program (NEP) exploratory course, a startup support program for deep-tech ventures. At the final pitch event, NEP-Lab 2026, Lu received the VC Award selected by venture-capital stakeholders. This startup activity aims to implement technologies that Lu has developed through master's and doctoral research in society. The award recognized both the originality of the technology and its potential applications and social impact."
description_short: "博士2年の盧 慧敏氏がNEP-Lab 2026でVC賞を受賞しました。"
description_short_en: "Doctoral student Huimin Lu received the VC Award at NEP-Lab 2026."
